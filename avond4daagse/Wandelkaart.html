<script>

// Add the routes (datasets) to the map...
//////////////////////////////////////////

map.on('load', function() {

	}

function addLayerData(route) {
	$.when(
		// Loads a geoJsonfile route using ajax
		$.ajax({
			url : baseUrl + '/' + route.label + '.geojson',
			type : 'GET',
			dataType: 'json',
			success: console.log("Route data " + route.label + " successfully loaded."),
			error: function (xhr) {
				alert(xhr.statusText + ": " + route.label + " could not be loaded.")
			}
		})
		.done(function(result){
			// When loading is done, add the route
			route.geoJsonData_Route = result;
			addRoute(route);
			return;
		}),
		// End Loads a geoJsonfile route using ajax
	
		// Loads a geoJsonfile notifications file using ajax
		$.ajax({
			url : baseUrl + '/' + route.label + '_Notifications.geojson',
			type : 'GET',
			dataType: 'json',
			success: console.log("Notifications data " + route.label + " successfully loaded."),
			error: function (xhr) {
				console.log(xhr.statusText + ": Could not load notifications data " + route.label + "." )
				// alert(xhr.statusText)
			}
		})
		.done(function(result){
			// When loading is done, add the notifications
			route.geoJsonData_Notifications = result;
			addNotifications(route);
			return;
		}),
	).then(function() {
		if (route.label === activeRoute) {
			setActiveRoute(route);
		}
		else {
			setInactiveRoute(route);
		}
	});
}

// Callback function from the menu...
//////////////////////////////////////
function setActiveRoute(route) {
	console.log("Activate Route: " + route.label);
	// Make the selected route active
	activeRoute = route.layerID
	activeRouteObject = route;
	// Set the menu-item of the selected route active
	route.link.className = 'active';
	// Show the selected route notification items...
	$( "."+route.layerID ).show();
	// Show the route
	map.setLayoutProperty(route.layerID, 'visibility', 'visible');
	// Zoom to the route
	map.fitBounds(route.bbox);
	// Re-render markers for the new active route
    renderMarkers();
};

// Callback function from the menu...
//////////////////////////////////////
function setInactiveRoute(route) {
	if (typeof route.link !== 'undefined') {
		// Set the menu-item to not-active
		route.link.className = '';
		// Hide the non-selected route notification items...
		$( "."+route.layerID ).hide();
		// Hide the non-selected route
		map.setLayoutProperty(route.layerID, 'visibility', 'none');
		// Remove markers for this route from the map
        const markers = document.querySelectorAll('.' + route.layerID);
        markers.forEach(marker => marker.remove());
	}
};

function renderMarkers() {
    if (!activeRouteObject || !activeRouteObject.geoJsonData_Notifications) {
        return;
    }

    // Remove all existing markers for the active route from the map
    const existingMarkers = document.querySelectorAll('.' + activeRouteObject.layerID);
    existingMarkers.forEach(marker => marker.remove());

    // Re-add all markers from the GeoJSON
    activeRouteObject.geoJsonData_Notifications.features.forEach(marker => {
        if (showMarkers.includes(marker.properties['marker-symbol'])) {
            const el = document.createElement('div');
            el.className = activeRouteObject.layerID + ' marker zoom' + marker.properties['zoom-level'];
            el.id = 'marker' + marker.properties['marker-symbol'];
            el.innerHTML = '<div>' + marker.id + '</div>';

            const markerIcon = new mapboxgl.Marker({ element: el, draggable: editMarkers })
                .setLngLat(marker.geometry.coordinates)
                .setPopup(new mapboxgl.Popup({ offset: 25 })
                    .setHTML('<h3>' + marker.properties.title + '</h3><p>' + marker.properties.description + '</p>'))
                .setRotationAlignment("map")
                .addTo(map);

            if (editMarkers) {
                markerIcon.on('dragend', () => {
                    const { lng, lat } = markerIcon.getLngLat();
                    // Update the marker's coordinates in the GeoJSON
                    const featureIndex = activeRouteObject.geoJsonData_Notifications.features.findIndex(
                        f => f.id === marker.id
                    );
                    if (featureIndex !== -1) {
                        activeRouteObject.geoJsonData_Notifications.features[featureIndex].geometry.coordinates = [lng, lat];
                    }
                });
            }
        }
    });
}
// Draw the Map Matching route as a new layer on the map
function addRoute(route) {

	// Calculate the route distance
	// var routeDistance = turf.lineDistance(route.geoJsonData_Route.features[0]).toFixed(1).toLocaleString();
	var routeDistance = turf.length(route.geoJsonData_Route.features[0],{units: 'kilometers'}).toFixed(1).toLocaleString();
	// Add the menuItem for this route...
	route.menuItem = route.label + " (" + routeDistance + " KM)";
	route.layerID = route.label
	route.bbox = turf.bbox(route.geoJsonData_Route.features[0]);

	// If a layerID is already loaded, remove it
	if (map.getSource(route.layerID)) {
		map.removeLayer(route.layerID)
		map.removeSource(route.layerID)
	} else {
		map.addLayer({
			"id": route.layerID,
			"type": "line",
			"source": {
				"type": "geojson",
				"data": route.geoJsonData_Route
			},
			"layout": {
				"line-join": "round",
				"line-cap": "round"
			},
			"paint": {
				"line-color": "#03AA46",
				"line-width": 8,
				"line-opacity": 0.8
			}
		});
		console.log("Route " + route.layerID + " successfully added.");
		addLayerMenuItem(route);
	};
}

// Functions to add and edit markers
///////////////////////////////////////
	
// Update marker data in the array
function updateMarkerData(marker, lng, lat) {
  const index = showMarkers.findIndex(m => m.marker === marker);
  if (index !== -1) {
	showMarkers[index].lng = lng;
	showMarkers[index].lat = lat;
  }
}

function addNotifications(route) {
    // The GeoJSON is already loaded into route.geoJsonData_Notifications
    // Just re-render the markers for this route
    if (route === activeRouteObject) {
        renderMarkers();
    }
}
	
// Draw the Map Matching notifications as a new layer on the map
function addNotificationsOLD(route) {

	// add markers to map
	route.geoJsonData_Notifications.features.forEach(function(marker) {
		if (showMarkers.includes(marker.properties['marker-symbol'])) {
			// create a HTML element for each feature
			var el = document.createElement('div');
		
			el.className = route.layerID + ' marker zoom' + marker.properties['zoom-level'];
			el.innerHTML = '<div>' + marker.id + '</div>';
			
			switch (marker.properties['marker-symbol']) {
				case 'N':
					el.id = 'markerN';
				break;
				case 'ZW':
					el.id = 'markerZW';
				break;
				default:
					el.id = 'marker' + marker.properties['marker-symbol'];
				break;
			}
			if (debug == true) {
				console.log("Marker: " + marker.properties.title + " " + 
				"Class: " + el.className + " ID: " + el.id);
			}
			// make a marker for each feature and add to the map
			const markerIcon = new mapboxgl.Marker({element: el, draggable: editMarkers})
				.setLngLat(marker.geometry.coordinates)
				.setPopup(new mapboxgl.Popup({ offset: 25 }) // add popups
				.setHTML('<h3>' + marker.properties.title + '</h3><p>' + marker.properties.description + '</p>'))
				.setRotationAlignment("map")
				.addTo(map);
			if (editMarkers) {
				// Update marker position when dragged
				markerIcon.on('dragend', () => {
					const { lng, lat } = markerIcon.getLngLat();
					updateMarkerData(markerIcon, lng, lat);
				});
			}
	  
			console.log("Marker " + marker.id + " " + marker.properties['marker-symbol'] + " successfully added.");
		}
		else {
			if (debug == true) {
				console.log("Marker: " + marker.properties.title + " NOT ADDED");
			}
		}
	});
}

function getNextMarkerId(features) {
    if (!features || features.length === 0) {
        return 1; // Start from 1 if no markers exist
    }

    // Find the maximum numeric ID in the features array
    const maxId = Math.max(
        ...features
            .map(feature => {
                // Handle cases where ID is a string (e.g., "1") or number
                const id = parseInt(feature.id, 10);
                return isNaN(id) ? 0 : id;
            })
    );

    return maxId + 1;
}
	
function addMarker(lngLat) {
    if (!activeRouteObject || !activeRouteObject.geoJsonData_Notifications) {
        alert("No active route to add markers to!");
        return;
    }

	// Get the next available ID
    const nextId = getNextMarkerId(activeRouteObject.geoJsonData_Notifications.features);

    // Create a new GeoJSON feature for the marker
    const newMarker = {
        type: "Feature",
        id: nextId,
        geometry: {
            type: "Point",
            coordinates: [lngLat.lng, lngLat.lat]
        },
        properties: {
            title: "New Marker",
            description: "",
            "marker-symbol": "Sponsor", // Default
            "zoom-level": 14 // Default
        }
    };

    // Add the new marker to the GeoJSON
    activeRouteObject.geoJsonData_Notifications.features.push(newMarker);

    // Re-render all markers
    renderMarkers();
}
	
// Add a marker at a location
function addMarkerOLD(lngLat) {
  const marker = new mapboxgl.Marker({ draggable: true })
	.setLngLat(lngLat)
	.addTo(map);

  // Update marker position when dragged
  marker.on('dragend', () => {
	const { lng, lat } = marker.getLngLat();
	updateMarkerData(marker, lng, lat);
  });

  // Add to markers array
  markers.push({
	marker,
	lng: lngLat.lng,
	lat: lngLat.lat
  });
}

// Add marker button
document.getElementById('add-marker').addEventListener('click', () => {
  const center = map.getCenter();

});

document.getElementById('save-markers').addEventListener('click', () => {
    if (!activeRouteObject || !activeRouteObject.geoJsonData_Notifications) {
        alert("No active route or markers to save!");
        return;
    }

    // Create a FeatureCollection with only the markers for the active route
    const markersToSave = {
        type: "FeatureCollection",
        features: activeRouteObject.geoJsonData_Notifications.features
    };

    const json = JSON.stringify(markersToSave, null, 2);
    document.getElementById('json-output').value = json;

    // Download the file
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = activeRouteObject.label + '_Markers.json';
    a.click();
    URL.revokeObjectURL(url);
});

document.getElementById('load-markers-file').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file || !activeRouteObject) {
        alert("No file selected or no active route!");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const loadedData = JSON.parse(e.target.result);

            // Validate that the loaded data is a FeatureCollection
            if (!loadedData.type || loadedData.type !== "FeatureCollection" || !loadedData.features) {
                alert("Invalid file: Expected a GeoJSON FeatureCollection with 'features' array.");
                return;
            }

            // Replace the markers for the active route
            activeRouteObject.geoJsonData_Notifications.features = loadedData.features;

            // Re-render markers on the map
            renderMarkers();

            // Optional: Display the loaded JSON in the textarea
            document.getElementById('json-output').value = JSON.stringify(loadedData, null, 2);

        } catch (error) {
            alert("Error parsing JSON: " + error.message);
        }
    };
    reader.readAsText(file);
    // Clear the file input to allow re-uploading the same file
    event.target.value = '';
});
	



if (debug == true) {

	document.write("<pre id=\"debug\"></pre>");

	map.on('mousemove', function(e) {

		JSON.stringify(e.point) +
		'<br />' +
		// e.lngLat is the longitude, latitude geographical position of the event
		JSON.stringify(e.lngLat.wrap()) +
		'<br />' 
	});
}
